<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <header class="container-fluid bg-primary p-3  d-flex justify-content-between align-item-center">
        <h1 class="text-white">Codechatbot</h1>
        <div style="width: 50px; height: 50px; border-radius: 50%;" class=" bg-white"></div>
        <!--main-container-->
    </header>
    <!-- main container -->

    <div class="row">
        <!--sidebar-->
        <div class="col-2 bg-dark text-white p-3" style="min-height: 100vh;">
            <h2>Sidebar</h2>
        </div>

        <!--chatbot-->
        <div class="d-flex flex-column mt-4 col-10 overflow-auto flex-grow-1" style="min-height: 100vh;">
            <!-- chatbot -->
            <div class="d-flex flex-column" style="min-height: 100vh;">

            <!-- user data -->
            <div class="d-flex mt-3 overflow-auto justify-content-end ">
                <div class="p-4 bg-danger border rounded-4 text-white " style="margin-right: 20px;">Hey Shree</div>
            </div>

            <!-- Ai Result -->
            <div class="d-flex mt-3 overflow-auto justify-content-start">
                <div class="p-4 bg-dark border rounded-4 text-white w-50" style="margin-right: 20px;">
                    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Aut, cum molestiae repellendus non
                        reiciendis amet ratione corrupti repudiandae aperiam praesentium.</p>
                </div>

            </div>

            <!-- user data -->
            <div class="d-flex mt-3 overflow-auto justify-content-end">
                <div class="p-4 bg-danger border rounded-4 text-white" style="margin-right: 20px;">How are you?</div>
            </div>

            <!-- Ai Result -->
            <div class="d-flex mt-3 overflow-auto justify-content-start">
                <div class="p-4 bg-dark border rounded-4 text-white w-50" style="margin-right: 20px;">
                    <p>I'm fine. wbu?</p>
                </div>

            </div>

           
        </div>
        <div class="d-flex flex-column ">
            <div class="d-flex gap-4 mb-5 p-4 ">
                <input class="form-control" type="text" value="Readonly input here..."
                    aria-label="readonly input example" readonly>
                <div class="">
                    <button class="text-white btn btn-primary border-rounded-1">
                        Send
                    </button>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
