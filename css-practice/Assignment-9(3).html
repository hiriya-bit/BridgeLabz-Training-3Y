```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
        }

        /* Cards using Flexbox */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            padding: 40px;
        }

        .card {
            flex: 1 1 calc(25% - 25px);
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .card:hover {
            background-color: #dbeafe;
        }

        /* Tablet - 2 columns */
        @media (max-width: 900px) {
            .card {
                flex: 1 1 calc(50% - 25px);
            }
        }

        /* Mobile - 1 column */
        @media (max-width: 600px) {
            .card {
                flex: 1 1 100%;
            }

            .cards {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Cards</h1>
    </header>

    <main>
        <section class="cards">

            <article class="card">
                <h2>HTML</h2>
                <p>HTML creates the structure of a webpage.</p>
            </article>

            <article class="card">
                <h2>CSS</h2>
                <p>CSS is used to style webpages.</p>
            </article>

            <article class="card">
                <h2>Flexbox</h2>
                <p>Flexbox creates flexible layouts.</p>
            </article>

            <article class="card">
                <h2>Grid</h2>
                <p>CSS Grid creates two-dimensional layouts.</p>
            </article>

        </section>
    </main>

</body>
</html>
```
