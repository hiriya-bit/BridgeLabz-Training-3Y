```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
        }

        /* Side-by-side images */
        .comparison {
            display: flex;
            gap: 30px;
            padding: 40px;
        }

        figure {
            flex: 1;
            margin: 0;
            text-align: center;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
        }

        figure img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        /* Filter on right image */
        .filtered {
            filter: contrast(180%);
            transition: filter 0.6s ease;
        }

        /* Remove filter on hover */
        .filtered:hover {
            filter: none;
        }

        figcaption {
            padding: 15px;
            font-weight: bold;
        }

        /* Stack below 700px */
        @media (max-width: 700px) {
            .comparison {
                flex-direction: column;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <figure>
                <img src="https://picsum.photos/id/1015/600/400"
                     alt="Original Image">
                <figcaption>Before - Original</figcaption>
            </figure>

            <figure>
                <img class="filtered"
                     src="https://picsum.photos/id/1015/600/400"
                     alt="Filtered Image">
                <figcaption>After - Filtered</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
```
