```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
        }

        /* Flexbox cards */
        .profiles {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 40px;
        }

        .profile-card {
            width: 280px;
            padding: 20px;
            text-align: center;
            background-color: white;
            border-radius: 12px;

            /* Fade-in animation */
            animation: fadeIn 1s ease;

            transition: transform 0.3s ease;
        }

        .profile-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: filter 0.4s ease;
        }

        /* Filters */
        .gray {
            filter: grayscale(100%);
        }

        .sepia {
            filter: sepia(100%);
        }

        /* Hover effects */
        .profile-card:hover {
            transform: translateY(-10px);
        }

        .profile-card:hover img {
            filter: none;
        }

        /* Keyframe animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stack below 800px */
        @media (max-width: 800px) {
            .profiles {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles">

            <article class="profile-card">
                <img class="gray"
                     src="https://i.pravatar.cc/400?img=12"
                     alt="Riya">
                <h2>Riya</h2>
                <p>Web Developer</p>
            </article>

            <article class="profile-card">
                <img class="sepia"
                     src="https://i.pravatar.cc/400?img=32"
                     alt="Aman">
                <h2>Aman</h2>
                <p>UI Designer</p>
            </article>

            <article class="profile-card">
                <img class="gray"
                     src="https://i.pravatar.cc/400?img=47"
                     alt="Neha">
                <h2>Neha</h2>
                <p>Software Engineer</p>
            </article>

        </section>
    </main>

</body>
</html>
