```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typography</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .content {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            text-align: center;
            background-color: white;
            border-radius: 10px;
        }

        /* Required clamp values */
        h1 {
            font-size: clamp(1.5rem, 4vw, 3rem);
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
        }

        /* Better readability on small screens */
        @media (max-width: 700px) {
            .content {
                margin: 20px;
                padding: 25px;
            }

            p {
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <main>
        <section class="content">

            <h1>Responsive Typography</h1>

            <p>
                Responsive typography allows text to automatically change
                its size according to the screen width. The clamp() function
                helps create flexible and readable text on different devices.
            </p>

        </section>
    </main>

</body>
</html>
```
